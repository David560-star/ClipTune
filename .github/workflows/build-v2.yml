name: Build APK v2
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip install --upgrade pip cython==0.29.36 buildozer
      - name: Armar proyecto v2
        run: |
          cp v2_buildozer.spec buildozer.spec
          cp v2_main.py main.py
          cp v2_descarga.py descarga.py
          cp v2_servicio.py servicio.py
          mkdir -p java/org/musicdl/musicdl2
          cp v2_ShareActivity.java java/org/musicdl/musicdl2/ShareActivity.java
      - name: Preparar python-for-android
        run: |
          buildozer -v android p4a -- --help || true
          P4A=.buildozer/android/platform/python-for-android
          [ -d "$P4A" ] || git clone --depth 1 https://github.com/kivy/python-for-android.git "$P4A"
          rm -rf ../p4a_local
          cp -r "$P4A" ../p4a_local
          python - <<'EOF'
          import glob, sys
          bloque = """
              <activity android:name=".ShareActivity"
                        android:label="MusicDL 2"
                        android:theme="@android:style/Theme.Translucent.NoTitleBar"
                        android:exported="true"
                        android:excludeFromRecents="true"
                        android:taskAffinity="">
                  <intent-filter>
                      <action android:name="android.intent.action.SEND" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <data android:mimeType="text/plain" />
                  </intent-filter>
              </activity>
          """
          total = 0
          for a in glob.glob("../p4a_local/**/AndroidManifest.tmpl.xml", recursive=True):
              t = open(a, encoding="utf-8").read()
              if "</application>" in t and ".ShareActivity" not in t:
                  open(a, "w", encoding="utf-8").write(t.replace("</application>", bloque + "</application>", 1))
                  total += 1
                  print("parchado:", a)
          if total == 0:
              sys.exit("No encontré la plantilla del manifiesto")
          EOF
          sed -i "/^\[app\]/a p4a.source_dir = $(realpath ../p4a_local)" buildozer.spec
      - name: Compilar APK
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log
      - name: Resumen del error
        if: failure()
        run: awk '/# Command failed/{exit} {print}' build.log | tail -40
      - uses: actions/upload-artifact@v4
        with:
          name: MusicDL2
          path: bin/*.apk
