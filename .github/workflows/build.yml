name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64-v8a, armeabi-v7a]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip install --upgrade pip cython==0.29.36 buildozer
      - name: Colocar el código Java
        run: |
          mkdir -p java/org/cliptune/cliptune
          cp ShareActivity.java CancelReceiver.java java/org/cliptune/cliptune/
      - name: Configurar arquitectura
        run: sed -i 's/^android.archs.*/android.archs = ${{ matrix.arch }}/' buildozer.spec
      - name: Firma fija (para actualizar sin desinstalar)
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > ~/.android/debug.keystore
            keytool -list -keystore ~/.android/debug.keystore -storepass android | grep -i "SHA-256"
            echo "Firma fija lista"
          else
            echo "AVISO: no encontré el secreto DEBUG_KEYSTORE_B64"
          fi
      - name: Preparar python-for-android
        run: |
          buildozer -v android p4a -- --help || true
          P4A=.buildozer/android/platform/python-for-android
          [ -d "$P4A" ] || git clone --depth 1 https://github.com/kivy/python-for-android.git "$P4A"
          rm -rf ../p4a_local
          cp -r "$P4A" ../p4a_local
          python - <<'EOF'
          import glob, sys
          bloque = open("manifest_extra.xml", encoding="utf-8").read()
          total = 0
          for a in glob.glob("../p4a_local/**/AndroidManifest.tmpl.xml", recursive=True):
              t = open(a, encoding="utf-8").read()
              if "</application>" in t and ".ShareActivity" not in t:
                  open(a, "w", encoding="utf-8").write(t.replace("</application>", bloque + "\n</application>", 1))
                  total += 1
                  print("parchado:", a)
          if total == 0:
              sys.exit("No encontré la plantilla del manifiesto")
          EOF
          sed -i "/^\[app\]/a p4a.source_dir = $(realpath ../p4a_local)" buildozer.spec
      - name: Compilar APK
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log
      - name: Resumen del error
        if: failure()
        run: awk '/# Command failed/{exit} {print}' build.log | tail -40
      - uses: actions/upload-artifact@v4
        with:
          name: ClipTune-${{ matrix.arch }}
          path: bin/*.apk
