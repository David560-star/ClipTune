name: Build APK 32 bits
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip install --upgrade pip cython==0.29.36 buildozer
      - name: Configurar 32 bits
        run: sed -i 's/^android.archs.*/android.archs = armeabi-v7a/' buildozer.spec
      - name: Compilar APK
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log
      - name: Resumen del error
        if: failure()
        run: awk '/# Command failed/{exit} {print}' build.log | tail -40
      - uses: actions/upload-artifact@v4
        with:
          name: MusicDL-32bits
          path: bin/*.apk
